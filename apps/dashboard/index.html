<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Operator dashboard for the real-network slice arbitration testbed." />
    <title>Slice Arbitration Testbed</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Apply a stored dark preference before first paint; light is the default.
      (function () {
        try {
          document.documentElement.classList.toggle('dark', localStorage.getItem('testbed.theme') === 'dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
